<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" role="img" aria-labelledby="schema-titre">
  <title id="schema-titre">Circuit de publication d'afisteb.be : éditeur, Decap CMS, GitHub et GitHub Actions, hébergement OVH, visiteurs</title>
  <style>
    svg{--sans:-apple-system,BlinkMacSystemFont,'avenir next',avenir,'helvetica neue',helvetica,ubuntu,roboto,noto,'segoe ui',arial,sans-serif;--code:Consolas,Monaco,Menlo,monospace}
    .fond{fill:none}
    .carte{fill:#ffffff;stroke:#cccccc;stroke-width:1.5}
    .groupe{fill:#e9e9e9;stroke:#cccccc;stroke-width:1.5}
    .groupe-lav{fill:#e9e9e9;stroke:#cccccc;stroke-width:1.5}
    text{font-family:var(--sans)}
    .titre{fill:#111111;font-size:16px;font-weight:700}
    .titre-groupe{fill:#111111;font-size:13px;font-weight:700;letter-spacing:.08em}
    .texte{fill:#555555;font-size:13px}
    .mono{fill:#333333;font-size:12.5px;font-family:var(--code)}
    .fleche{fill:none;stroke:#111111;stroke-width:2.5}
    .pointille{fill:none;stroke:#777777;stroke-width:1.5;stroke-dasharray:6 5}
    .tete{fill:#111111}
    .tete-grise{fill:#777777}
    .pastille{fill:#111111}
    .num{fill:#ffffff;font-size:13px;font-weight:700}
    .icone{fill:none;stroke:#357edd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .note{fill:#555555;font-size:12.5px;font-style:italic}
    .legende{fill:#333333;font-size:13.5px}
  </style>
  <defs>
    <marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tete" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="pointe-grise" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tete-grise" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="fond" x="0" y="0" width="1160" height="580"/>

  <!-- Lien pointillé : OVH sert Decap et le relais de connexion -->
  <path class="pointille" d="M880,150 V52 H315 V184" marker-end="url(#pointe-grise)"/>
  <text class="note" x="597" y="42" text-anchor="middle">OVH sert aussi l'interface Decap (/admin/) et le relais de connexion à GitHub</text>

  <!-- 1. Éditeur -->
  <rect class="carte" x="20" y="180" width="150" height="140" rx="10"/>
  <circle class="icone" cx="95" cy="210" r="10"/>
  <path class="icone" d="M77,238 a18,14 0 0 1 36,0"/>
  <text class="titre" x="95" y="270" text-anchor="middle">Éditeur</text>
  <text class="texte" x="95" y="290" text-anchor="middle">membre de</text>
  <text class="texte" x="95" y="306" text-anchor="middle">l'association</text>

  <!-- 2. Decap CMS -->
  <rect class="carte" x="230" y="180" width="170" height="140" rx="10"/>
  <rect class="icone" x="297" y="198" width="36" height="28" rx="3"/>
  <path class="icone" d="M297,206 H333"/>
  <path class="icone" d="M304,214 H322 M304,220 H316"/>
  <text class="titre" x="315" y="252" text-anchor="middle">Decap CMS</text>
  <text class="texte" x="315" y="272" text-anchor="middle">interface d'édition</text>
  <text class="texte" x="315" y="288" text-anchor="middle">dans le navigateur</text>
  <text class="mono" x="315" y="306" text-anchor="middle">afisteb.be/admin/</text>

  <!-- 3. GitHub -->
  <rect class="groupe" x="460" y="90" width="260" height="355" rx="12"/>
  <text class="titre-groupe" x="480" y="118">GITHUB</text>
  <rect class="carte" x="480" y="135" width="220" height="85" rx="8"/>
  <circle class="icone" cx="504" cy="157" r="4"/>
  <circle class="icone" cx="504" cy="191" r="4"/>
  <circle class="icone" cx="522" cy="170" r="4"/>
  <path class="icone" d="M504,161 V187 M504,182 Q504,174 518,172"/>
  <text class="titre" x="538" y="164">Dépôt Git</text>
  <text class="texte" x="538" y="184">textes, images, code</text>
  <text class="texte" x="538" y="201">historique complet</text>

  <rect class="carte" x="480" y="260" width="220" height="170" rx="8"/>
  <path class="icone" d="M500,276 l8,8 l-8,8"/>
  <path class="icone" d="M512,292 h9"/>
  <text class="titre" x="532" y="291">GitHub Actions</text>
  <text class="texte" x="498" y="322">• tests (PHP et JavaScript)</text>
  <text class="texte" x="498" y="346">• construction par Hugo</text>
  <text class="texte" x="498" y="370">• contrôle du résultat</text>
  <text class="texte" x="498" y="394">• envoi des fichiers modifiés</text>
  <text class="note" x="498" y="418">un échec bloque la publication</text>

  <!-- 4. OVH -->
  <rect class="groupe-lav" x="790" y="150" width="190" height="295" rx="12"/>
  <path class="icone" d="M810,166 h26 v9 h-26 z M810,179 h26 v9 h-26 z"/>
  <text class="titre-groupe" x="846" y="182">OVH</text>
  <rect class="carte" x="805" y="200" width="160" height="125" rx="8"/>
  <text class="mono" x="820" y="223" style="font-weight:700">afisteb-prod/www/</text>
  <text class="texte" x="820" y="250">pages HTML statiques</text>
  <text class="texte" x="820" y="272">images et PDF</text>
  <text class="texte" x="820" y="294">formulaires (PHP)</text>
  <text class="texte" x="820" y="314">anti-robot ALTCHA</text>
  <rect class="carte" x="805" y="340" width="160" height="88" rx="8"/>
  <text class="mono" x="820" y="363" style="font-weight:700">hors du web</text>
  <text class="texte" x="820" y="388">clés et secrets,</text>
  <text class="texte" x="820" y="408">jamais dans Git</text>

  <!-- 5. Visiteurs -->
  <rect class="carte" x="1030" y="180" width="115" height="140" rx="10"/>
  <circle class="icone" cx="1078" cy="208" r="8"/>
  <path class="icone" d="M1063,232 a15,12 0 0 1 30,0"/>
  <circle class="icone" cx="1100" cy="214" r="6"/>
  <path class="icone" d="M1096,226 a12,10 0 0 1 16,8"/>
  <text class="titre" x="1087" y="266" text-anchor="middle">Visiteurs</text>
  <text class="mono" x="1087" y="288" text-anchor="middle">afisteb.be</text>

  <!-- Flèches du circuit -->
  <path class="fleche" d="M170,250 H226" marker-end="url(#pointe)"/>
  <path class="fleche" d="M400,250 H440 V180 H476" marker-end="url(#pointe)"/>
  <path class="fleche" d="M590,220 V256" marker-end="url(#pointe)"/>
  <path class="fleche" d="M700,345 H786" marker-end="url(#pointe)"/>
  <path class="fleche" d="M980,250 H1026" marker-end="url(#pointe)"/>

  <!-- Pastilles numérotées -->
  <g>
    <circle class="pastille" cx="198" cy="250" r="12"/><text class="num" x="198" y="255" text-anchor="middle">1</text>
    <circle class="pastille" cx="440" cy="215" r="12"/><text class="num" x="440" y="220" text-anchor="middle">2</text>
    <circle class="pastille" cx="590" cy="239" r="12"/><text class="num" x="590" y="244" text-anchor="middle">3</text>
    <circle class="pastille" cx="743" cy="345" r="12"/><text class="num" x="743" y="350" text-anchor="middle">4</text>
    <circle class="pastille" cx="1005" cy="250" r="12"/><text class="num" x="1005" y="255" text-anchor="middle">5</text>
  </g>

  <!-- Légende -->
  <g>
    <circle class="pastille" cx="32" cy="487" r="10"/><text class="num" x="32" y="491.5" text-anchor="middle" style="font-size:11.5px">1</text>
    <text class="legende" x="50" y="492">L'éditeur écrit un article dans Decap, depuis son navigateur.</text>
    <circle class="pastille" cx="32" cy="517" r="10"/><text class="num" x="32" y="521.5" text-anchor="middle" style="font-size:11.5px">2</text>
    <text class="legende" x="50" y="522">Decap enregistre le texte et les images dans le dépôt GitHub (un commit).</text>
    <circle class="pastille" cx="32" cy="547" r="10"/><text class="num" x="32" y="551.5" text-anchor="middle" style="font-size:11.5px">3</text>
    <text class="legende" x="50" y="552">Ce commit déclenche GitHub Actions : tests, puis construction du site par Hugo.</text>
    <circle class="pastille" cx="612" cy="487" r="10"/><text class="num" x="612" y="491.5" text-anchor="middle" style="font-size:11.5px">4</text>
    <text class="legende" x="630" y="492">Seuls les fichiers modifiés sont envoyés chez OVH (SFTP).</text>
    <circle class="pastille" cx="612" cy="517" r="10"/><text class="num" x="612" y="521.5" text-anchor="middle" style="font-size:11.5px">5</text>
    <text class="legende" x="630" y="522">Les visiteurs reçoivent des pages toutes prêtes, sans base de données.</text>
  </g>
</svg>
